name: CI

on:
  pull_request:
  push:
    branches: [main, developer]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # O build e o prisma generate não acessam o banco; valores fictícios só para a configuração carregar
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-somente-para-build-nao-usar-em-producao-0123456789
      # Mesmo fuso da produção (Vercel), para os testes pegarem erros de data
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
